name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: CI checks out, installs, validates and builds. It writes nothing.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          # Full history. links:audit rebuilds every pre-redesign URL from the
          # pinned baseline commit in scripts/links-audit.ts; the default
          # depth-1 clone does not contain it and the audit would exit 1.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Content first: a malformed markdown file is the most likely breakage on
      # this repo and the cheapest to catch. Checks OKF v0.2 conformance, the
      # Zod schemas, every internal link, every image path, and index freshness.
      - name: Validate content
        run: npm run content:validate

      # The Field Notes consent flow: double opt-in, token handling, bot
      # checks, unsubscribe. No AWS needed — runs on the in-memory driver.
      - name: Field Notes self-test
        run: npm run field-notes:selftest

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Every URL that existed before the 2026 redesign must still resolve.
      # These live in slide decks and other districts' documentation, so a
      # broken redirect is not recoverable by editing our own links.
      - name: Audit redirects
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          npm run links:audit
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
