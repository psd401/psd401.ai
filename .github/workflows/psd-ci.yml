name: PSD CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  psd-ci:
    uses: PSD401/.github/.github/workflows/reusable-psd-ci.yml@1aa5f5351a78b15f5c71668037f5d35b9613ae41 # v1.0.0
    with:
      # package.json names the script `type-check`, not `typecheck`.
      typecheck-command: npm run type-check
      # No `test` script: the repo's tests are the content validator and the
      # Field Notes self-test (in-memory driver, no AWS), as in ci.yml.
      test-command: npm run content:validate && npm run field-notes:selftest
