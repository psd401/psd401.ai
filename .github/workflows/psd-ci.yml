name: PSD CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  psd-ci:
    uses: PSD401/.github/.github/workflows/reusable-psd-ci.yml@9b1afe0d9fc34cb6f5427179854ebf7852a1c748 # v1.2.1
    with:
      # Matches ci.yml, amplify.yml and package.json engines.
      node-version: '24'
      # package.json names the script `type-check`, not `typecheck`.
      typecheck-command: bun run type-check
      # No `test` script: the repo's tests are the content validator and the
      # Field Notes self-test (in-memory driver, no AWS), as in ci.yml.
      test-command: bun run content:validate && bun run field-notes:selftest
