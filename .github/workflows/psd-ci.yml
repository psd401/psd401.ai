name: PSD CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  psd-ci:
    # @main is deliberate: org-owned reusable; central bumps must propagate
    # (psd-dev-standards standards/06). zizmor: ignore[unpinned-uses]
    uses: PSD401/.github/.github/workflows/reusable-psd-ci.yml@main # zizmor: ignore[unpinned-uses]
    with:
      # package.json names the script `type-check`, not `typecheck`.
      typecheck-command: npm run type-check
      # No `test` script: the repo's tests are the content validator and the
      # Field Notes self-test (in-memory driver, no AWS), as in ci.yml.
      test-command: npm run content:validate && npm run field-notes:selftest
